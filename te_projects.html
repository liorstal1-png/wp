<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#F5F4F0;--sur:#fff;--brd:#E0DED8;--txt:#1A1A18;--mut:#888780;--fnt:#B4B2A9;--acc:#378ADD;--r:8px;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;direction:rtl;}
.topbar{height:52px;background:var(--sur);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 24px;gap:10px;flex-shrink:0;}
.topbar h1{font-size:16px;font-weight:700;}
.spacer{flex:1;}
.btn{font-family:'Heebo',sans-serif;font-size:12px;padding:6px 11px;border:1px solid var(--brd);border-radius:var(--r);background:var(--sur);cursor:pointer;color:var(--txt);white-space:nowrap;}
.btn:hover{background:var(--bg);}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc);}
.btn-p:hover{background:#2b6db5;}
.btn-sm{padding:4px 8px;font-size:11px;}
.body{flex:1;overflow-y:auto;padding:32px 24px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:900px;}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:12px;padding:20px;cursor:pointer;transition:box-shadow .15s,border-color .15s;position:relative;min-height:90px;}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:var(--acc);}
.card-name{font-size:14px;font-weight:700;margin-bottom:5px;}
.card-meta{font-size:11px;color:var(--mut);line-height:1.5;}
.card-actions{position:absolute;top:10px;left:10px;display:flex;gap:4px;opacity:0;transition:opacity .15s;}
.card:hover .card-actions{opacity:1;}
.card-actions button{background:none;border:none;cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;color:var(--mut);}
.card-actions button:hover{background:var(--bg);}
.add-card{background:none;border:2px dashed var(--brd);border-radius:12px;padding:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:90px;color:var(--fnt);transition:border-color .15s,color .15s;}
.add-card:hover{border-color:var(--acc);color:var(--acc);}
.add-card .plus{font-size:28px;line-height:1;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(2px);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;direction:rtl;}
.ov.open{display:flex;animation:fi .15s;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--sur);border-radius:12px;border:1px solid var(--brd);width:100%;max-width:360px;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.mhdr{padding:.8rem 1rem .6rem;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;}
.mtitle{font-size:14px;font-weight:700;}
.mx{background:none;border:none;cursor:pointer;font-size:16px;color:var(--fnt);}
.mbody{padding:.85rem 1rem;}
.mfoot{padding:.6rem 1rem;border-top:1px solid var(--brd);display:flex;gap:7px;}
.fld{margin-bottom:.75rem;}
.fld label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px;}
.fld input,.fld textarea,.fld select{width:100%;font-family:'Heebo',sans-serif;font-size:13px;padding:7px 9px;border:1px solid var(--brd);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;direction:rtl;}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--acc);}
.fld input[type=number]{direction:ltr;text-align:right;}
.section-title{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--brd);}
</style>
  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDOIwsCqDyivx8kdCUQHEVPTWFYFfB-yFw",
      authDomain: "scheduling-a5647.firebaseapp.com",
      projectId: "scheduling-a5647",
      storageBucket: "scheduling-a5647.firebasestorage.app",
      messagingSenderId: "1086458270592",
      appId: "1:1086458270592:web:1dff903b00ed4e62426765"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ── Save project to Firebase ──
    window._fbSaveProject = async function(id, projData) {
      try {
        await setDoc(doc(db, 'te_projects', id), { payload: JSON.stringify(projData) });
      } catch(e) { console.error('FB save project error:', e); }
    };

    // ── Load all projects from Firebase ──
    window._fbLoadAllProjects = async function() {
      try {
        const snap = await getDocs(collection(db, 'te_projects'));
        var projects = {};
        snap.forEach(function(d){ projects[d.id] = JSON.parse(d.data().payload); });
        return projects;
      } catch(e) { console.error('FB load projects error:', e); return null; }
    };

    // ── Delete project from Firebase ──
    window._fbDeleteProject = async function(id) {
      try {
        const { deleteDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
        await deleteDoc(doc(db, 'te_projects', id));
      } catch(e) {}
    };

    // ── Save sprint config ──
    window._fbSaveSprintConfig = async function(cfg) {
      try {
        await setDoc(doc(db, 'te_config', 'sprint'), { payload: JSON.stringify(cfg) });
      } catch(e) {}
    };

    // ── Load sprint config ──
    window._fbLoadSprintConfig = async function() {
      try {
        const snap = await getDoc(doc(db, 'te_config', 'sprint'));
        if(snap.exists()) return JSON.parse(snap.data().payload);
      } catch(e) {}
      return null;
    };

    // ── Real-time listener — refresh grid when projects change ──
    onSnapshot(collection(db, 'te_projects'), function(snap) {
      // עדכן localStorage מFirebase ורנדר מחדש
      snap.forEach(function(d) {
        try {
          var projData = JSON.parse(d.data().payload);
          localStorage.setItem('te_proj_' + d.id, JSON.stringify(projData));
        } catch(e) {}
      });
      if(typeof window.renderGrid === 'function') window.renderGrid();
    });

  </script>
</head>

    </div>

<script>
window.onerror=function(msg,src,line,col,err){alert('ERROR: '+msg+' line:'+line);};
var PREFIX='te_proj_';
var _editId=null;

// ── Storage ────────────────────────────────────────────────────────────────
function listProjects(){
  var list=[];
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.indexOf(PREFIX)===0){
      try{
        var p=JSON.parse(localStorage.getItem(k));
        // skip corrupted entries where id is not a simple string
        if(p&&p.meta&&typeof p.meta.id==='string'&&p.meta.id.indexOf('[')<0){
          list.push(p.meta);
        }
      }catch(e){}
    }
  }
  list.sort(function(a,b){return (b.updatedAt||0)-(a.updatedAt||0);});
  return list;
}
function loadProject(id){try{return JSON.parse(localStorage.getItem(PREFIX+id));}catch(e){return null;}}
function saveProject(id,meta,data){
  meta.updatedAt=Date.now();
  var proj={meta:meta,data:data};
  localStorage.setItem(PREFIX+id,JSON.stringify(proj));
  if(window._fbSaveProject) window._fbSaveProject(id, proj);
}
function deleteProject(id){
  localStorage.removeItem(PREFIX+id);
  if(window._fbDeleteProject) window._fbDeleteProject(id);
}

function getSprintConfig(){
  try{var s=localStorage.getItem('te_sprint_config');if(s)return JSON.parse(s);}catch(e){}
  return {firstSprint:27,weeksPerSprint:3,startDate:null,hoursPerWeek:42};
}
function saveSprintConfig(cfg){
  localStorage.setItem('te_sprint_config',JSON.stringify(cfg));
  if(window._fbSaveSprintConfig) window._fbSaveSprintConfig(cfg);
}

// טעינה ראשונית מ-Firebase
(async function(){
  if(!window._fbLoadAllProjects) return; // Firebase לא נטען עדיין
  // המתן ל-Firebase
  var tries=0;
  while(!window._fbLoadAllProjects&&tries<20){await new Promise(function(r){setTimeout(r,100);});tries++;}
  if(!window._fbLoadAllProjects) return;
  var projects=await window._fbLoadAllProjects();
  if(projects){
    Object.keys(projects).forEach(function(id){
      localStorage.setItem(PREFIX+id,JSON.stringify(projects[id]));
    });
  }
  // גם sprint config
  if(window._fbLoadSprintConfig){
    var sc=await window._fbLoadSprintConfig();
    if(sc) localStorage.setItem('te_sprint_config',JSON.stringify(sc));
  }
  if(typeof window.renderGrid==='function') window.renderGrid();
})();

// ── Render home ────────────────────────────────────────────────────────────
window.renderGrid=function renderGrid(){
  var g=document.getElementById('grid');g.innerHTML='';
  listProjects().forEach(function(p){
    var c=document.createElement('div');c.className='card';
    var updated=p.updatedAt?new Date(p.updatedAt).toLocaleDateString('he-IL'):'';
    // name and meta
    var nm=document.createElement('div');nm.className='card-name';nm.textContent=p.name;
    var mt=document.createElement('div');mt.className='card-meta';
    var metaParts=[];
    if(p.globalId)metaParts.push('<span style="font-family:monospace;font-size:10px;background:#EBF4FF;color:var(--acc);border-radius:3px;padding:1px 5px;">'+p.globalId+'</span>');
    if(p.desc)metaParts.push(p.desc);
    if(updated)metaParts.push('עודכן: '+updated);
    mt.innerHTML=metaParts.join(' · ');
    // action buttons
    var acts=document.createElement('div');acts.className='card-actions';
    var eb=document.createElement('button');eb.textContent='✏️';
    var db=document.createElement('button');db.textContent='🗑';db.style.color='#E24B4A';
    acts.appendChild(eb);acts.appendChild(db);
    c.appendChild(acts);c.appendChild(nm);c.appendChild(mt);
    // click handlers using closure
    (function(id){
      c.addEventListener('click',function(e){
        if(e.target===eb||e.target===db)return;
        openProject(id);
      });
      eb.addEventListener('click',function(e){e.stopPropagation();editProj(id,e);});
      db.addEventListener('click',function(e){e.stopPropagation();delProj(id,e);});
    })(String(p.id));
    g.appendChild(c);
  });
  var add=document.createElement('div');add.className='add-card';
  add.innerHTML='<div class="plus">+</div><div style="font-size:12px;">פרויקט חדש</div>';
  add.onclick=function(){openProjModal();};
  g.appendChild(add);
};

// ── Project CRUD ───────────────────────────────────────────────────────────
function openProjModal(id){
  // ensure id is a valid string, not an event object
  _editId=(id&&typeof id==='string')?id:null;
  document.getElementById('pm-title').textContent=id?'ערוך פרויקט':'פרויקט חדש';
  var p=id?loadProject(id):null;
  document.getElementById('pm-name').value=p?p.meta.name:'';
  document.getElementById('pm-desc').value=p&&p.meta.desc?p.meta.desc:'';
  document.getElementById('pm-gid').value=p&&p.meta.globalId?p.meta.globalId:'';
  document.getElementById('projModal').classList.add('open');
  setTimeout(function(){document.getElementById('pm-name').focus();},50);
}
function closeProjModal(){document.getElementById('projModal').classList.remove('open');}

function saveProj(){
  var name=document.getElementById('pm-name').value.trim();if(!name)return;
  var desc=document.getElementById('pm-desc').value.trim();
  var globalId=document.getElementById('pm-gid').value.trim()||undefined;
  var isNew=!_editId;
  // ensure id is always a clean string
  var id=(typeof _editId==='string'&&_editId)?_editId:('p'+Date.now());
  var existing=_editId?loadProject(id):null;
  var meta={id:id,name:name,desc:desc,globalId:globalId,createdAt:existing?existing.meta.createdAt:Date.now()};
  saveProject(id,meta,existing?existing.data:null);
  _editId=null;
  closeProjModal();
  renderGrid();
  if(isNew)openProject(id);
}
function editProj(id,e){e.stopPropagation();openProjModal(id);}
function delProj(id,e){
  e.stopPropagation();
  var p=loadProject(id);if(!confirm('למחוק "'+( p?p.meta.name:id)+'"?'))return;
  deleteProject(id);renderGrid();
}

// ── Open project (navigate to planner) ────────────────────────────────────
function openProject(id){
  var proj=loadProject(id);
  if(!proj)return;
  // apply org template to new projects that have no data
  if(!proj.data){
    loadOrgTemplate();
    if(_orgTemplate.groups.length>0){
      proj.data={
        groups:JSON.parse(JSON.stringify(_orgTemplate.groups)),
        teams:JSON.parse(JSON.stringify(_orgTemplate.teams)),
        workers:JSON.parse(JSON.stringify(_orgTemplate.workers)),
        tasks:[],sprints:[],milestones:[],deps:[],
        nextGid:_orgTemplate.nextGid,nextTmid:_orgTemplate.nextTmid,
        nextWid:_orgTemplate.nextWid,nextTid:100,nextSid:1,nextMid:1,nextDid:1
      };
    }
  }
  // Pass data via sessionStorage - completely isolated per session
  sessionStorage.setItem('te_active_pid', id);
  sessionStorage.setItem('te_active_pname', proj.meta.name);
  if(proj.data){
    sessionStorage.setItem('te_active', JSON.stringify({
      D: proj.data,
      ZL: 100,
      TL_WEEKS: 24,
      TL_START: null,
      collapsed: {},
      MODE_WEEKS: false
    }));
  } else {
    sessionStorage.removeItem('te_active');
  }
  window.location.href='./te_planner.html';
}

// ── Settings ───────────────────────────────────────────────────────────────
// ── ORG TEMPLATE ──────────────────────────────────────────────────────────
var _orgTemplate={groups:[],teams:[],workers:[],nextGid:10,nextTmid:20,nextWid:30};
var COLS=['#378ADD','#1D9E75','#D85A30','#D4537E','#BA7517','#E24B4A','#7F77DD','#639922','#0F6E56','#3C3489'];

function loadOrgTemplate(){
  var cfg=getSprintConfig();
  if(cfg.orgTemplate)_orgTemplate=cfg.orgTemplate;
  else _orgTemplate={groups:[],teams:[],workers:[],nextGid:10,nextTmid:20,nextWid:30};
}

function renderOrgTree(){
  var el=document.getElementById('orgTree');
  if(!el)return;
  var html='';
  _orgTemplate.groups.forEach(function(g){
    html+='<div style="margin-bottom:6px;">';
    html+='<div style="display:flex;align-items:center;gap:6px;padding:4px 6px;background:'+(g.color||'#eee')+'22;border-radius:4px;border-right:3px solid '+(g.color||'#ccc')+';">';
    html+='<span style="font-size:12px;font-weight:700;flex:1;">'+g.name+'</span>';
    html+='<button onclick="addOrgTeam('+g.id+')" style="font-size:10px;background:none;border:none;cursor:pointer;color:var(--mut);">+ צוות</button>';
    html+='<button onclick="addOrgWorker('+g.id+',null)" style="font-size:10px;background:none;border:none;cursor:pointer;color:var(--mut);">+ עובד</button>';
    html+='<button onclick="editOrgGroup('+g.id+')" style="background:none;border:none;cursor:pointer;font-size:11px;">✏️</button>';
    html+='<button onclick="delOrgGroup('+g.id+')" style="background:none;border:none;cursor:pointer;font-size:11px;color:#E24B4A;">×</button>';
    html+='</div>';
    // teams
    _orgTemplate.teams.filter(function(t){return t.gid===g.id;}).forEach(function(t){
      html+='<div style="display:flex;align-items:center;gap:6px;padding:3px 6px 3px 18px;border-bottom:1px solid var(--brd);">';
      html+='<span style="font-size:11px;flex:1;">'+t.name+'</span>';
      html+='<button onclick="addOrgWorker('+g.id+','+t.id+')" style="font-size:10px;background:none;border:none;cursor:pointer;color:var(--mut);">+ עובד</button>';
      html+='<button onclick="delOrgTeam('+t.id+')" style="background:none;border:none;cursor:pointer;font-size:11px;color:#E24B4A;">×</button>';
      html+='</div>';
      // workers in team
      _orgTemplate.workers.filter(function(w){return w.tid===t.id;}).forEach(function(w){
        html+='<div style="display:flex;align-items:center;gap:5px;padding:2px 6px 2px 32px;">';
        html+='<div style="width:8px;height:8px;border-radius:50%;background:'+(w.color||'#999')+';flex-shrink:0;"></div>';
        html+='<span style="font-size:11px;flex:1;">'+w.name+'</span>';
        html+='<span onclick="editOrgWorker('+w.id+')" title="'+(w.globalId?'מזהה: '+w.globalId:'הוסף מזהה')+'" style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;border:1px solid var(--brd);cursor:pointer;background:var(--bg);color:'+(w.globalId?'var(--acc)':'var(--mut)')+';">'+(w.globalId||'+ ID')+'</span>';
        html+='<button onclick="delOrgWorker('+w.id+')" style="background:none;border:none;cursor:pointer;font-size:11px;color:#E24B4A;">×</button>';
        html+='</div>';
      });
    });
    // workers directly in group (no team)
    _orgTemplate.workers.filter(function(w){return w.gid===g.id&&!w.tid;}).forEach(function(w){
      html+='<div style="display:flex;align-items:center;gap:5px;padding:2px 6px 2px 18px;">';
      html+='<div style="width:8px;height:8px;border-radius:50%;background:'+(w.color||'#999')+';flex-shrink:0;"></div>';
      html+='<span style="font-size:11px;flex:1;">'+w.name+'</span>';
      html+='<span onclick="editOrgWorker('+w.id+')" title="'+(w.globalId?'מזהה: '+w.globalId:'הוסף מזהה')+'" style="font-size:9px;font-family:monospace;padding:1px 5px;border-radius:3px;border:1px solid var(--brd);cursor:pointer;background:var(--bg);color:'+(w.globalId?'var(--acc)':'var(--mut)')+';">'+(w.globalId||'+ ID')+'</span>';
      html+='<button onclick="delOrgWorker('+w.id+')" style="background:none;border:none;cursor:pointer;font-size:11px;color:#E24B4A;">×</button>';
      html+='</div>';
    });
    html+='</div>';
  });
  el.innerHTML=html||'<div style="font-size:11px;color:var(--mut);text-align:center;padding:8px;">לחץ + קבוצה להוספה</div>';
}

var _orgEditGid=null,_orgWorkerGid=null,_orgWorkerTid=null;

function openOrgModal(){loadOrgTemplate();renderOrgTree();document.getElementById('orgModal').classList.add('open');}
function closeOrgModal(){document.getElementById('orgModal').classList.remove('open');saveSprintConfig(Object.assign(getSprintConfig(),{orgTemplate:_orgTemplate}));}

function openOrgGroupModal(id){
  _orgEditGid=id||null;
  var g=id?_orgTemplate.groups.find(function(x){return x.id===id;}):null;
  document.getElementById('ogg-title').textContent=g?'ערוך קבוצה':'קבוצה חדשה';
  document.getElementById('ogg-name').value=g?g.name:'';
  buildOrgColors('ogg-colors',g?g.color:COLS[_orgTemplate.groups.length%COLS.length]);
  document.getElementById('orgGroupModal').classList.add('open');
  setTimeout(function(){document.getElementById('ogg-name').focus();},50);
}
function closeOrgGroupModal(){document.getElementById('orgGroupModal').classList.remove('open');}
function saveOrgGroup(){
  var name=document.getElementById('ogg-name').value.trim();if(!name)return;
  var ce=document.querySelector('#ogg-colors .org-copt.on');
  var col=ce?ce.dataset.hex:COLS[0];
  if(_orgEditGid){var g=_orgTemplate.groups.find(function(x){return x.id===_orgEditGid;});if(g){g.name=name;g.color=col;}}
  else _orgTemplate.groups.push({id:_orgTemplate.nextGid++,name:name,color:col});
  closeOrgGroupModal();renderOrgTree();
}
function addOrgGroup(){openOrgGroupModal(null);}

function addOrgTeam(gid){
  var name=prompt('שם צוות:');if(!name||!name.trim())return;
  _orgTemplate.teams.push({id:_orgTemplate.nextTmid++,name:name.trim(),gid:gid});
  renderOrgTree();
}
function delOrgGroup(id){
  if(!confirm('למחוק קבוצה?'))return;
  _orgTemplate.groups=_orgTemplate.groups.filter(function(x){return x.id!==id;});
  _orgTemplate.teams=_orgTemplate.teams.filter(function(x){return x.gid!==id;});
  _orgTemplate.workers=_orgTemplate.workers.filter(function(x){return x.gid!==id;});
  renderOrgTree();
}
function delOrgTeam(id){
  _orgTemplate.teams=_orgTemplate.teams.filter(function(x){return x.id!==id;});
  _orgTemplate.workers=_orgTemplate.workers.filter(function(x){return x.tid!==id;});
  renderOrgTree();
}

function openOrgWorkerModal(gid,tid){
  _orgWorkerGid=gid;_orgWorkerTid=tid||null;
  var g=_orgTemplate.groups.find(function(x){return x.id===gid;});
  var shades=g&&g.color?orgGroupShades(g.color):COLS;
  document.getElementById('ogw-name').value='';
  document.getElementById('ogw-gid').value='';
  buildOrgColors('ogw-colors',shades[2]||shades[0],shades);
  document.getElementById('orgWorkerModal').classList.add('open');
  setTimeout(function(){document.getElementById('ogw-name').focus();},50);
}
function closeOrgWorkerModal(){window._editingOrgWorkerId=null;document.getElementById('orgWorkerModal').classList.remove('open');}
function saveOrgWorker(){
  var name=document.getElementById('ogw-name').value.trim();if(!name)return;
  var ce=document.querySelector('#ogw-colors .org-copt.on');
  var col=ce?ce.dataset.hex:COLS[0];
  var globalId=document.getElementById('ogw-gid').value.trim()||undefined;
  if(window._editingOrgWorkerId){
    var w=_orgTemplate.workers.find(function(x){return x.id===window._editingOrgWorkerId;});
    if(w){w.name=name;w.color=col;w.globalId=globalId;}
    window._editingOrgWorkerId=null;
  } else {
    _orgTemplate.workers.push({id:_orgTemplate.nextWid++,name:name,color:col,gid:_orgWorkerGid,tid:_orgWorkerTid,globalId:globalId});
  }
  closeOrgWorkerModal();renderOrgTree();
}
function addOrgWorker(gid,tid){openOrgWorkerModal(gid,tid);}
function editOrgWorker(id){
  var w=_orgTemplate.workers.find(function(x){return x.id===id;});if(!w)return;
  var g=_orgTemplate.groups.find(function(x){return x.id===w.gid;});
  var shades=g&&g.color?orgGroupShades(g.color):COLS;
  _orgWorkerGid=w.gid;_orgWorkerTid=w.tid||null;
  document.getElementById('ogw-name').value=w.name;
  document.getElementById('ogw-gid').value=w.globalId||'';
  buildOrgColors('ogw-colors',w.color||shades[2]||shades[0],shades);
  // mark current color
  document.querySelectorAll('#ogw-colors .org-copt').forEach(function(c){
    c.classList.toggle('on',c.dataset.hex===w.color);
  });
  // override save to update existing
  window._editingOrgWorkerId=id;
  document.getElementById('orgWorkerModal').classList.add('open');
  setTimeout(function(){document.getElementById('ogw-name').focus();},50);
}
function delOrgWorker(id){
  _orgTemplate.workers=_orgTemplate.workers.filter(function(x){return x.id!==id;});
  renderOrgTree();
}

function orgGroupShades(base){
  var shades=[];
  [0.55,0.4,0.25,0.1,0,-0.15,-0.3].forEach(function(amt){
    shades.push(amt>0?lightenHex(base,amt):amt===0?base:darkenHex(base,Math.abs(amt)));
  });
  return shades;
}
function darkenHex(hex,amt){
  hex=hex.replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  function h(v){return Math.round(Math.max(0,v*(1-amt))).toString(16).padStart(2,'0');}
  return '#'+h(r)+h(g)+h(b);
}
function buildOrgColors(cid,sel,palette){
  var p=palette||COLS;var c=document.getElementById(cid);c.innerHTML='';
  p.forEach(function(col){
    var sw=document.createElement('div');sw.className='org-copt'+(col===sel?' on':'');
    sw.style.cssText='width:22px;height:22px;border-radius:50%;background:'+col+';cursor:pointer;border:2px solid '+(col===sel?'#222':'transparent')+';transition:transform .1s;display:inline-block;margin:2px;';
    sw.dataset.hex=col;
    sw.onclick=function(){c.querySelectorAll('.org-copt').forEach(function(x){x.style.border='2px solid transparent';x.classList.remove('on');});sw.style.border='2px solid #222';sw.classList.add('on');};
    c.appendChild(sw);
  });
}
function lightenHex(hex,amt){
  hex=hex.replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  var r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  function h(v){return Math.round(Math.min(255,v+(255-v)*amt)).toString(16).padStart(2,'0');}
  return '#'+h(r)+h(g)+h(b);
}

function openSettings(){
  loadOrgTemplate();
  var cfg=getSprintConfig();
  document.getElementById('ss-first').value=cfg.firstSprint||27;
  document.getElementById('ss-weeks').value=cfg.weeksPerSprint||3;
  document.getElementById('ss-hours').value=cfg.hoursPerWeek||42;
  if(cfg.startDate)document.getElementById('ss-date').value=cfg.startDate;
  else{
    var d=new Date();d.setDate(d.getDate()-d.getDay());
    document.getElementById('ss-date').value=d.toISOString().slice(0,10);
  }
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('open');}
function saveSettings(){
  saveSprintConfig({
    firstSprint:parseInt(document.getElementById('ss-first').value)||27,
    weeksPerSprint:parseInt(document.getElementById('ss-weeks').value)||3,
    startDate:document.getElementById('ss-date').value,
    hoursPerWeek:parseInt(document.getElementById('ss-hours').value)||42,
    orgTemplate:_orgTemplate
  });
  closeSettings();
  // toast
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E3A5F;color:#fff;padding:7px 18px;border-radius:8px;font-size:13px;z-index:999;';
  t.textContent='✓ הגדרות נשמרו';document.body.appendChild(t);
  setTimeout(function(){t.remove();},2000);
}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    document.querySelectorAll('.ov.open').forEach(function(m){m.classList.remove('open');});
  }
});

renderGrid();
</script>
