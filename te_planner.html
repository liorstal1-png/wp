<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תכנית עבודה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#F5F4F0;--sur:#fff;--brd:#E0DED8;--txt:#1A1A18;--mut:#888780;--fnt:#B4B2A9;--acc:#378ADD;--r:8px;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;direction:rtl;}
.topbar{height:52px;background:var(--sur);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;}
.topbar h1{font-size:14px;font-weight:700;}
.btn{font-family:'Heebo',sans-serif;font-size:12px;padding:6px 11px;border:1px solid var(--brd);border-radius:var(--r);background:var(--sur);cursor:pointer;color:var(--txt);white-space:nowrap;}
.btn:hover{background:var(--bg);}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc);}
.btn-p:hover{background:#2b6db5;}
.btn-sm{padding:4px 8px;font-size:11px;}
.zbtn{width:24px;height:24px;border:1px solid var(--brd);border-radius:5px;background:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.zbtn:hover{background:var(--bg);}
.zlbl{font-size:11px;color:var(--mut);min-width:30px;text-align:center;}
.tsep{width:1px;height:22px;background:var(--brd);flex-shrink:0;}
.spacer{flex:1;}
.main{display:flex;flex:1;overflow:hidden;min-height:0;direction:rtl;}
/* sidebar */
.sidebar{width:200px;min-width:80px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--brd);background:var(--sur);z-index:20;overflow:hidden;}
.sidebar-hdr{height:112px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px;font-weight:700;flex-shrink:0;}
.sidebar-body{flex:1;overflow-y:auto;overflow-x:hidden;}
.sidebar-body::-webkit-scrollbar{width:4px;}
.sidebar-body::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px;}
.resize-handle{width:5px;cursor:col-resize;background:transparent;flex-shrink:0;}
.resize-handle:hover,.resize-handle.dragging{background:var(--acc);}
/* tree */
.tree-group-hdr{height:28px;min-height:28px;display:flex;align-items:center;padding:0 6px 0 8px;gap:4px;background:#E4E2DB;border-bottom:1px solid #ccc;cursor:pointer;user-select:none;flex-shrink:0;}
.tree-group-hdr:hover{background:#d8d6cf;}
.tree-team-hdr{height:30px;min-height:30px;display:flex;align-items:center;padding:0 6px 0 16px;gap:4px;border-bottom:1px solid var(--brd);background:#F0EEE8;cursor:pointer;user-select:none;flex-shrink:0;}
.tree-team-hdr:hover{background:#eae8e2;}
.tree-worker-row{height:40px;min-height:40px;display:flex;align-items:center;padding:0 6px 0 26px;gap:5px;border-bottom:1px solid var(--brd);flex-shrink:0;position:relative;background:#fff;}
.tree-worker-row:hover{background:#f8f8f6;}
.tree-toggle{font-size:8px;color:var(--fnt);width:10px;flex-shrink:0;}
.tree-label{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;outline:none;}
.tree-label.group-lbl{font-size:13px;font-weight:700;color:var(--txt);letter-spacing:.02em;}
.tree-label.team-lbl{font-size:12px;font-weight:600;color:var(--txt);}
.tree-label[contenteditable=true]:focus{background:rgba(55,138,221,.08);border-radius:3px;}
.wdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;cursor:pointer;border:1.5px solid rgba(0,0,0,.1);}
.wname-edit{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;border-radius:3px;padding:1px 2px;outline:none;}
.wname-edit:focus{outline:1px solid var(--acc);background:#fff;}
.row-del{opacity:0;background:none;border:none;cursor:pointer;font-size:11px;padding:1px 3px;color:var(--fnt);flex-shrink:0;}
.tree-worker-row:hover .row-del,.tree-team-hdr:hover .row-del,.tree-group-hdr:hover .row-del{opacity:1;}
/* timeline */
.tlwrap{flex:1;overflow:auto;min-width:0;direction:rtl;}
.tlwrap::-webkit-scrollbar{height:5px;width:5px;}
.tlwrap::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px;}
.tlinner{display:inline-block;min-width:100%;position:relative;direction:rtl;}
.tl-hdr{position:sticky;top:0;z-index:15;background:var(--sur);}
.sprrow{display:flex;border-bottom:1px solid var(--brd);background:var(--bg);direction:rtl;height:34px;}
.spr-empty{flex-shrink:0;height:34px;}
.spr-block{flex-shrink:0;height:34px;display:flex;align-items:center;padding:0 1px;}
.spr-inner{background:#6B7280;color:#fff;font-size:11px;font-weight:700;border-radius:4px;height:28px;display:flex;align-items:center;padding:0 8px;cursor:pointer;width:100%;overflow:hidden;white-space:nowrap;gap:4px;}
.spr-inner:hover{background:#4B5563;}
.spr-inner span{flex:1;overflow:hidden;text-overflow:ellipsis;}
.spr-del{opacity:0;background:rgba(255,255,255,.2);border:none;color:#fff;cursor:pointer;border-radius:3px;padding:0 4px;font-size:10px;flex-shrink:0;}
.spr-inner:hover .spr-del{opacity:1;}
.mrow{display:flex;border-bottom:1px solid var(--brd);background:var(--sur);direction:rtl;height:28px;}
.mcell{border-left:2px solid var(--brd);display:flex;align-items:center;justify-content:center;padding:0 4px;font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap;flex-shrink:0;overflow:hidden;}
.wkrow{display:flex;border-bottom:1px solid var(--brd);background:var(--sur);direction:rtl;height:26px;}
.msrow{position:relative;height:24px;border-bottom:1px solid var(--brd);background:var(--sur);direction:rtl;overflow:visible;}
.wkcell{border-left:1px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--fnt);flex-shrink:0;}
.wkcell.tw{background:#EBF4FF;}
.wkcell.tw span{color:var(--acc);font-weight:700;}
.tlbody{position:relative;}
.tlrow-group{height:28px;border-bottom:1px solid #ccc;position:relative;display:flex;direction:rtl;background:#E4E2DB;}
.tlrow-team{height:30px;border-bottom:1px solid var(--brd);position:relative;display:flex;direction:rtl;background:#F0EEE8;}
.tlrow{height:40px;border-bottom:1px solid var(--brd);position:relative;display:flex;direction:rtl;background:#fff;}
.tlrow:hover{background:#fafaf8;}
.tcell{border-left:1px solid #e8e6e0;flex-shrink:0;height:100%;cursor:pointer;}
.tcell:hover{background:rgba(55,138,221,.06);}
.tcell.tw{background:rgba(55,138,221,.03);}
.tlrow-group .tcell,.tlrow-team .tcell{cursor:default;}
.tlrow-group .tcell:hover,.tlrow-team .tcell:hover{background:transparent;}

/* blocks */
.blk{position:absolute;top:5px;bottom:5px;border-radius:5px;cursor:grab;display:flex;align-items:center;padding:0 8px;font-size:11px;color:#fff;overflow:hidden;user-select:none;z-index:5;direction:rtl;gap:3px;}
.blk:hover{filter:brightness(1.08);z-index:10;}
.blk.drag{opacity:.7;cursor:grabbing;z-index:100;}
.blk.sel{outline:2px solid #fff;outline-offset:-2px;filter:brightness(1.15);}
.btitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:11px;pointer-events:none;}
.blk-note-dot{font-size:13px;font-weight:900;color:#FF4444;flex-shrink:0;pointer-events:auto;line-height:1;text-shadow:0 0 4px rgba(0,0,0,.4);cursor:default;padding:0 3px;}
.note-tooltip{position:fixed;background:#1E2A3A;color:#fff;border-radius:8px;padding:10px 14px;font-family:'Heebo',sans-serif;font-size:13px;line-height:1.6;max-width:220px;white-space:pre-wrap;pointer-events:none;z-index:600;box-shadow:0 4px 16px rgba(0,0,0,.35);direction:rtl;display:none;}
.rhandle-r{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2;}
.rhandle-l{position:absolute;left:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2;}
.rhandle-r:hover,.rhandle-l:hover{background:rgba(255,255,255,.4);}
.blk-opts{opacity:0;width:0;overflow:hidden;padding:0;background:rgba(255,255,255,.22);border:none;cursor:pointer;font-size:10px;border-radius:3px;color:#fff;flex-shrink:0;transition:opacity .1s;}
.blk:hover .blk-opts{opacity:1;width:auto;padding:1px 4px;}
.blk-del{opacity:0;width:0;overflow:hidden;padding:0;background:rgba(255,255,255,.22);border:none;cursor:pointer;font-size:10px;border-radius:3px;color:#fff;flex-shrink:0;transition:opacity .1s;}
.blk:hover .blk-del{opacity:1;width:auto;padding:1px 5px;}
.blk.sel .blk-del{opacity:1;width:auto;padding:1px 5px;}
/* lasso */
.lasso{position:fixed;border:1.5px dashed var(--acc);background:rgba(55,138,221,.07);pointer-events:none;z-index:50;}
/* sel toolbar */
.sel-bar{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.15);padding:6px 10px;display:none;align-items:center;gap:8px;z-index:400;font-size:12px;white-space:nowrap;}
.sel-bar.on{display:flex;}
/* modals */
.ctx{position:fixed;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:300;min-width:150px;padding:4px 0;display:none;direction:rtl;}
.ctx.open{display:block;}
.ci{padding:7px 13px;font-size:12px;cursor:pointer;}
.ci:hover{background:var(--bg);}
.ci.del{color:#E24B4A;}
.ci-sep{height:1px;background:var(--brd);margin:3px 0;}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(2px);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;direction:rtl;}
.ov.open{display:flex;animation:fi .15s;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--sur);border-radius:12px;border:1px solid var(--brd);width:100%;max-width:340px;box-shadow:0 8px 40px rgba(0,0,0,.18);animation:pi .18s cubic-bezier(.34,1.56,.64,1);}
@keyframes pi{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.mhdr{padding:.8rem 1rem .6rem;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;}
.mtitle{font-size:14px;font-weight:700;}
.mx{background:none;border:none;cursor:pointer;font-size:16px;color:var(--fnt);}
.mbody{padding:.85rem 1rem;}
.mfoot{padding:.6rem 1rem;border-top:1px solid var(--brd);display:flex;gap:7px;}
.fld{margin-bottom:.75rem;}
.fld label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px;}
.fld input,.fld select{width:100%;font-family:'Heebo',sans-serif;font-size:13px;padding:7px 9px;border:1px solid var(--brd);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;direction:rtl;}
.fld input:focus,.fld select:focus{border-color:var(--acc);}
.fld input[type=number]{direction:ltr;text-align:right;}
.crow{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.copt{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s;}
.copt:hover{transform:scale(1.15);}
.copt.on{border-color:#222;transform:scale(1.15);}
/* toast handled dynamically */
.milestone-line{position:absolute;top:0;width:0;border-right:2px dashed;opacity:.6;pointer-events:none;z-index:11;}
.milestone-flag{position:absolute;cursor:pointer;z-index:9;color:#fff;font-size:10px;font-weight:600;padding:2px 8px 2px 14px;white-space:nowrap;transition:opacity .15s;font-family:'Heebo',sans-serif;direction:rtl;
  clip-path:polygon(100% 0%, 100% 100%, 10px 100%, 0% 50%, 10px 0%);}
.milestone-flag:hover{opacity:.85;}
.ms-tooltip{position:fixed;background:#1E3A5F;color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:500;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none;}
.rollup{position:absolute;top:4px;bottom:4px;border-radius:4px;opacity:.75;cursor:pointer;display:flex;align-items:center;padding:0 7px;font-size:10px;color:#fff;font-weight:600;overflow:hidden;white-space:nowrap;z-index:4;}
.rollup:hover{opacity:1;z-index:10;}
.rollup-tip{position:fixed;background:#1E3A5F;color:#fff;font-size:11px;padding:6px 10px;border-radius:6px;white-space:pre;pointer-events:none;z-index:500;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none;max-width:220px;white-space:normal;line-height:1.5;}
.dep-dot{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid #93C5FD;transform:translateY(-50%);cursor:crosshair;opacity:0;transition:opacity .15s;z-index:12;}
.dep-dot-r{right:-5px;}
.dep-dot-l{left:-5px;}
.blk:hover .dep-dot{opacity:1;}
.dep-del-btn{position:fixed;background:none;border:none;color:#93C5FD;font-size:14px;font-weight:700;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:200;line-height:1;padding:0;}
.cpop{position:fixed;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);z-index:500;padding:8px;display:none;flex-wrap:wrap;gap:5px;width:124px;box-shadow:0 4px 16px rgba(0,0,0,.12);}

</style>
  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDOIwsCqDyivx8kdCUQHEVPTWFYFfB-yFw",
      authDomain: "scheduling-a5647.firebaseapp.com",
      projectId: "scheduling-a5647",
      storageBucket: "scheduling-a5647.firebasestorage.app",
      messagingSenderId: "1086458270592",
      appId: "1:1086458270592:web:1dff903b00ed4e62426765"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ── Save project data ──
    var _fbSaveTimer = null;
    window._fbSavePlanner = function(pid, projData) {
      clearTimeout(_fbSaveTimer);
      _fbSaveTimer = setTimeout(async function(){
        try {
          await setDoc(doc(db, 'te_projects', pid), { payload: JSON.stringify(projData) });
        } catch(e) { console.error('FB planner save error:', e); }
      }, 1000);
    };

    // ── Load project data ──
    window._fbLoadPlanner = async function(pid) {
      try {
        const snap = await getDoc(doc(db, 'te_projects', pid));
        if(snap.exists()) return JSON.parse(snap.data().payload);
      } catch(e) { console.error('FB planner load error:', e); }
      return null;
    };

    // ── Load sprint config ──
    window._fbLoadSprintConfig = async function() {
      try {
        const snap = await getDoc(doc(db, 'te_config', 'sprint'));
        if(snap.exists()) return JSON.parse(snap.data().payload);
      } catch(e) {}
      return null;
    };

    // ── Real-time listener — sync כשמשתמש אחר שינה ──
    window._fbStartPlannerSync = function(pid) {
      onSnapshot(doc(db, 'te_projects', pid), function(snap) {
        if(!snap.exists()) return;
        try {
          var remote = JSON.parse(snap.data().payload);
          // עדכן localStorage
          localStorage.setItem('te_proj_' + pid, JSON.stringify(remote));
          // עדכן sessionStorage ורנדר רק אם D שונה
          if(JSON.stringify(window._teD) !== JSON.stringify(remote.data)) {
            window._teD = remote.data;
            if(typeof window._tePlannerLoad === 'function') window._tePlannerLoad(remote);
          }
        } catch(e) {}
      });
    };

  </script>
</head>
<body>
<div class="topbar">
  <button class="btn" onclick="goBackHome()" style="font-size:13px;padding:6px 10px;">← חזרה</button>
  <div class="tsep"></div>
  <h1 id="plannerTitle">📋 תכנית עבודה [v42]</h1>
  <div class="tsep"></div>
  <div style="display:flex;align-items:center;gap:3px;">
    <button class="zbtn" id="zoomOut">−</button>
    <span class="zlbl" id="zlbl">100%</span>
    <button class="zbtn" id="zoomIn">+</button>
  </div>
  <div class="tsep"></div>
  <button class="btn" id="addWorkerBtn">+ עובד</button>
  <button class="btn btn-p" id="addTaskBtn">+ משימה</button>
  <button class="btn" id="addSprintBtn">+ ספרינט</button>
  <button class="btn" id="addMsBtn">🚩 אבן דרך</button>
  <div class="tsep"></div>
  <button class="btn" id="rangeBtn">📅 טווח</button>
  <button class="btn btn-sm" onclick="applyQuickRange(12)">3M</button>
  <button class="btn btn-sm" onclick="applyQuickRange(24)">6M</button>
  <button class="btn btn-sm" onclick="applyQuickRange(52)">שנה</button>
  <button class="btn btn-sm" onclick="applyQuickRange(104)">2Y</button>
  <button class="btn" id="modeBtn">🔢 שבועות</button>
  <div class="spacer"></div>
  <button class="btn" id="undoBtn" title="Ctrl+Z">↩ ביטול</button>
  <button class="btn" id="clearDepsBtn" title="נקה תלויות">🔗 נקה תלויות</button>
  <button class="btn" id="summaryBtn">📊 סיכום</button>
  <button class="btn" id="tasksTableBtn">📋 פירוט משימות</button>
  <button class="btn" id="exportBtn">📥 ייצוא</button>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-hdr">
      <span>צוותים / עובדים</span>
      <button class="btn btn-sm" id="addGroupBtn">+ קבוצה</button>
    </div>
    <div class="sidebar-body" id="sidebarBody"></div>
  </div>
  <div class="resize-handle" id="rhSidebar"></div>
  <div class="tlwrap" id="tlwrap" tabindex="0" style="outline:none;">
    <div class="tlinner" id="tlinner">
      <div class="tl-hdr">
        <div class="sprrow" id="sprrow"></div>
        <div class="mrow" id="mrow"></div>
        <div class="wkrow" id="wkrow"></div>
        <div class="msrow" id="msrow"></div>
      </div>
      <div class="tlbody" id="tlbody"></div>
    </div>
  </div>
</div>

<!-- selection toolbar -->
<div class="sel-bar" id="selBar">
  <span id="selCount" style="color:var(--mut);font-size:11px;"></span>
  <button class="btn btn-sm" id="selColorBtn">🎨 צבע</button>
  <button class="btn btn-sm" id="selDelBtn" style="color:#E24B4A;">🗑 מחק</button>
  <button class="btn btn-sm" id="selCancelBtn">✕</button>
</div>

<!-- Group modal -->
<div class="ov" id="gmodal" onclick="if(event.target===this)cm('gmodal')">
  <div class="modal">
    <div class="mhdr"><span class="mtitle" id="gm-title">הוסף קבוצה</span><button class="mx" onclick="cm('gmodal')">✕</button></div>
    <div class="mbody">
      <div class="fld"><label>שם קבוצה</label><input id="gm-name" placeholder="פיתוח, עיצוב..."/></div>
      <div class="fld"><label>צבע קבוצה</label><div class="crow" id="gm-colors"></div></div>
    </div>
    <div class="mfoot"><button class="btn" onclick="cm('gmodal')">ביטול</button><button class="btn btn-p" onclick="saveGroup()">שמור</button></div>
  </div>
</div>

<!-- Team modal -->
<div class="ov" id="tmmodal" onclick="if(event.target===this)cm('tmmodal')">
  <div class="modal">
    <div class="mhdr"><span class="mtitle" id="tmm-title">הוסף צוות</span><button class="mx" onclick="cm('tmmodal')">✕</button></div>
    <div class="mbody">
      <div class="fld"><label>שם צוות</label><input id="tmm-name" placeholder="צוות A..."/></div>
      <div class="fld"><label>קבוצה</label><select id="tmm-group"></select></div>

    </div>
    <div class="mfoot"><button class="btn" onclick="cm('tmmodal')">ביטול</button><button class="btn btn-p" onclick="saveTeam()">שמור</button></div>
  </div>
</div>

<!-- Worker modal -->
<div class="ov" id="wmodal" onclick="if(event.target===this)cm('wmodal')">
  <div class="modal">
    <div class="mhdr"><span class="mtitle" id="wm-title">הוסף עובד</span><button class="mx" onclick="cm('wmodal')">✕</button></div>
    <div class="mbody">
      <div class="fld"><label>שם</label><input id="wm-name" placeholder="שם העובד..."/></div>
      <div class="fld"><label>מזהה עובד <span style="font-size:10px;color:var(--mut);font-weight:400;">(לקישור עם שיבוץ)</span></label><input id="wm-gid" placeholder="EMP001, alon.cohen..." style="font-family:monospace;"/></div>
      <div class="fld"><label>קבוצה</label><select id="wm-group"></select></div>
      <div class="fld"><label>צוות (אופציונלי)</label><select id="wm-team"></select></div>
      <div class="fld"><label>צבע</label><div class="crow" id="wm-colors"></div></div>
    </div>
    <div class="mfoot"><button class="btn" onclick="cm('wmodal')">ביטול</button><button class="btn btn-p" onclick="saveWorker()">שמור</button></div>
  </div>

<script>
function groupShades(base){
  if(!base)return COLS;
  var shades=[];
  [0.6,0.45,0.3,0.15,0,-0.15,-0.3,-0.45].forEach(function(amt){
    shades.push(amt>0?lighten(base,amt):amt===0?base:darken(base,Math.abs(amt)));
  });
  return shades;
}
var COLS=['#378ADD','#1D9E75','#D85A30','#D4537E','#BA7517','#E24B4A','#7F77DD','#639922','#0F6E56','#3C3489','#E07B20','#00BCD4'];
var MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
var SK='te_active';

var D={groups:[],teams:[],workers:[],tasks:[],sprints:[],milestones:[],deps:[],nextGid:10,nextTmid:20,nextWid:30,nextTid:100,nextSid:1,nextMid:1,nextDid:1};
var ZL=100, TL_WEEKS=24, MODE_WEEKS=false;
var TODAY=new Date(); TODAY.setHours(12,0,0,0);
var TL_START=sundayBefore(TODAY);
var collapsed={groups:{},teams:{}};
function safeCollapsed(){if(!collapsed)collapsed={};if(!collapsed.groups)collapsed.groups={};if(!collapsed.teams)collapsed.teams={};}
var selectedTids=new Set();
var _eGid=null,_eTmid=null,_eWid=null,_eTid=null,_eSid=null,_cpTarget=null,_ctxSprId=null;
var _clipboard=null;
var _lastClickedTid=null;
var _lastPasteWid=null;
var _lastMouseX=null;
var _lastMouseWi=null; // week index under mouse
var _undoStack=[], _UNDO_MAX=4;
function snapshot(){_undoStack.push(JSON.stringify(D));if(_undoStack.length>_UNDO_MAX)_undoStack.shift();}
function undo(){if(!_undoStack.length){toast('אין מה לבטל');return;}D=JSON.parse(_undoStack.pop());clearSel();render();toast('↩ ביטול פעולה');}
var _undoStack=[], _UNDO_MAX=4;
function snapshot(){
  _undoStack.push(JSON.stringify(D));
  if(_undoStack.length>_UNDO_MAX)_undoStack.shift();
}
function undo(){
  if(!_undoStack.length)return;
  D=JSON.parse(_undoStack.pop());
  clearSel();render();toast('↩ ביטול פעולה');
}

function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0,0);}
function fd(dt){var y=dt.getFullYear(),m=dt.getMonth()+1,d=dt.getDate();return y+'-'+(m<10?'0':'')+m+'-'+(d<10?'0':'')+d;}
function addW(dt,n){return new Date(dt.getTime()+n*7*86400000);}
function addD(dt,n){return new Date(dt.getTime()+n*86400000);}
function diffW(a,b){return (b.getTime()-a.getTime())/(7*86400000);}
function sundayBefore(dt){var d=new Date(dt);d.setDate(d.getDate()-d.getDay());d.setHours(12,0,0,0);return d;}
function wkDate(i){return addW(TL_START,i);}
function WW(){return Math.round(80*ZL/100);}
function totalW(){return TL_WEEKS*WW();}
function dateRight(s){return Math.round(diffW(TL_START,pd(s))*WW());}

function saveData(){
  try{
    var sd={D:D,ZL:ZL,TL_WEEKS:TL_WEEKS,TL_START:fd(TL_START),collapsed:collapsed,MODE_WEEKS:MODE_WEEKS};
    sessionStorage.setItem(SK,JSON.stringify(sd));
    // sync D back to project storage
    var pid=sessionStorage.getItem('te_active_pid');
    if(pid){
      var pkey='te_proj_'+pid;
      var proj=localStorage.getItem(pkey);
      if(proj){
        var p=JSON.parse(proj);
        p.data=D;
        p.meta.updatedAt=Date.now();
        localStorage.setItem(pkey,JSON.stringify(p));
        // שמור גם ב-Firebase
        if(window._fbSavePlanner) window._fbSavePlanner(pid, p);
      }
    }
  }catch(e){}
}
function loadData(){
  try{
    var s=sessionStorage.getItem(SK);if(!s)return false;
    var o=JSON.parse(s);
    D=o.D;ZL=o.ZL||100;TL_WEEKS=o.TL_WEEKS||24;
    if(o.TL_START)TL_START=pd(o.TL_START);
    if(o.collapsed){collapsed=o.collapsed;if(!collapsed.groups)collapsed.groups={};if(!collapsed.teams)collapsed.teams={};}
    if(o.MODE_WEEKS!==undefined)MODE_WEEKS=o.MODE_WEEKS;
    if(!D.groups)D.groups=[];if(!D.teams)D.teams=[];if(!D.sprints)D.sprints=[];if(!D.milestones)D.milestones=[];if(!D.nextMid)D.nextMid=1;if(!D.deps)D.deps=[];if(!D.nextDid)D.nextDid=1;
    // sprints are computed on-the-fly — clear any stale saved ones
    D.sprints=[];
    // clean orphaned deps immediately on load
    if(D.tasks&&D.deps){
      var tids=D.tasks.map(function(t){return +t.id;});
      D.deps=D.deps.filter(function(d){return tids.indexOf(+d.fromTid)!==-1&&tids.indexOf(+d.toTid)!==-1;});
    }
    // normalize weeks for all tasks using same formula as summary
    if(D.tasks){D.tasks.forEach(function(t){
      t.weeks=Math.max(1,Math.round((pd(t.end).getTime()-pd(t.start).getTime()-6*86400000)/(7*86400000))+1);
      t.end=fd(addD(addW(pd(t.start),t.weeks-1),6));
    });}
    return true;
  }catch(e){return false;}
}
function toast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E3A5F;color:#fff;padding:7px 18px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none;';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(function(){t.remove();},2000);
}

// ── RENDER ─────────────────────────────────────────────────────────────────
// ── COLOR HELPERS ──────────────────────────────────────────────────────────
function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  return {r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)};
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(function(v){return Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0');}).join('');
}
function lighten(hex,amount){ // amount 0-1, 1=white
  var c=hexToRgb(hex);
  return rgbToHex(c.r+(255-c.r)*amount,c.g+(255-c.g)*amount,c.b+(255-c.b)*amount);
}
function darken(hex,amount){ // amount 0-1, 1=black
  var c=hexToRgb(hex);
  return rgbToHex(c.r*(1-amount),c.g*(1-amount),c.b*(1-amount));
}
// get effective color for a worker (from hierarchy)
function render(){
  var TW=totalW(),WW_=WW();
  document.getElementById('tlinner').style.width=TW+'px';
  renderSprints(TW,WW_);
  renderMonths(TW,WW_);
  renderWeeks(TW,WW_);
  var mr2=document.getElementById('msrow');if(mr2)mr2.style.width=TW+'px';
  renderSidebar();
  renderBody(TW,WW_);
  renderMilestones();
  saveData();
  // clean up deps whose tasks no longer exist
  var taskIds=D.tasks.map(function(t){return t.id;});
  D.deps=D.deps.filter(function(d){return taskIds.indexOf(d.fromTid)!==-1&&taskIds.indexOf(d.toTid)!==-1;});
  requestAnimationFrame(redrawDeps);
}

function getRows(){
  safeCollapsed();
  var rows=[];
  var shown={};
  // First pass: claim all workers that belong to a group
  var claimed={};
  D.groups.forEach(function(g){
    D.workers.filter(function(w){return +w.gid===+g.id;}).forEach(function(w){claimed[w.id]=true;});
    D.teams.filter(function(t){return +t.gid===+g.id;}).forEach(function(t){
      D.workers.filter(function(w){return +w.tid===+t.id;}).forEach(function(w){claimed[w.id]=true;});
    });
  });
  // Second pass: build rows
  D.groups.forEach(function(g){
    rows.push({type:'group',obj:g});
    if(collapsed.groups[g.id])return;
    D.teams.filter(function(t){return +t.gid===+g.id;}).forEach(function(t){
      rows.push({type:'team',obj:t});
      if(collapsed.teams[t.id])return;
      D.workers.filter(function(w){return +w.tid===+t.id;}).forEach(function(w){
        rows.push({type:'worker',obj:w});
        shown[w.id]=true;
      });
    });
    // direct workers in group (no team, or team not in this group)
    D.workers.filter(function(w){
      if(shown[w.id])return false; // already added via team
      if(+w.gid!==+g.id)return false;
      return true;
    }).forEach(function(w){
      rows.push({type:'worker',obj:w});
      shown[w.id]=true;
    });
  });
  // workers not yet shown
  D.workers.filter(function(w){return !claimed[w.id]&&!shown[w.id];}).forEach(function(w){
    rows.push({type:'worker',obj:w});
  });
  return rows;
}

    } else if(row.type==='team'){

      var lbl=document.createElement('span');lbl.className='tree-label team-lbl';lbl.contentEditable='true';lbl.spellcheck=false;lbl.textContent=row.obj.name;
      var addBtn=document.createElement('button');addBtn.className='btn btn-sm';addBtn.style.cssText='padding:1px 7px;font-size:11px;font-weight:400;line-height:1;margin-right:auto;color:var(--mut);background:transparent;border:none;';addBtn.textContent='+ צוות';
      var addWBtn=document.createElement('button');addWBtn.style.cssText='padding:1px 6px;font-size:11px;background:transparent;border:none;cursor:pointer;color:var(--mut);line-height:1;';addWBtn.textContent='+ עובד';
      var del=document.createElement('button');del.className='row-del';del.textContent='×';
      el.appendChild(tog);el.appendChild(lbl);el.appendChild(addWBtn);el.appendChild(addBtn);el.appendChild(del);

        eBtn.addEventListener('click',function(e){e.stopPropagation();openTeamModal(t.id,null);});

        el.addEventListener('click',function(e){if(e.target===addBtn||e.target===del||e.target===lbl)return;collapsed.teams[t.id]=!collapsed.teams[t.id];render();});

    } else {

// ── SPRINT HELPERS ─────────────────────────────────────────────────────────
// Returns sprint object for a given week index, purely by math — no loops, no cache issues.
function getSprintForWeek(weekIndex){
  var cfg;
  try{cfg=JSON.parse(localStorage.getItem('te_sprint_config')||'{}');}catch(e){cfg={};}
  if(!cfg||!cfg.startDate)return null;
  var wps=cfg.weeksPerSprint||3;
  var firstN=cfg.firstSprint||1;
  var sDate=new Date(cfg.startDate+'T12:00:00');
  var msPerSprint=wps*7*86400000;
  var weekStart=wkDate(weekIndex); // already has hours:12 from addW
  var msDiff=weekStart.getTime()-sDate.getTime();
  if(msDiff<0)return null; // before first sprint
  var idx=Math.floor(msDiff/msPerSprint);
  var sprintStart=new Date(sDate.getTime()+idx*msPerSprint);
  var sprintEnd=new Date(sprintStart.getTime()+msPerSprint-86400000);
  return {
    id:idx+1,
    name:'Sprint '+(firstN+idx),
    start:fd(sprintStart),
    end:fd(sprintEnd),
    _idx:idx
  };
}

function renderSprints(TW,WW_){
  var row=document.getElementById('sprrow');row.innerHTML='';row.style.width=TW+'px';
  // build per-week sprint array using pure math
  var ws=[];
  var cfg;
  try{cfg=JSON.parse(localStorage.getItem('te_sprint_config')||'{}');}catch(e){cfg={};}
  var hasConfig=cfg&&cfg.startDate;
  for(var i=0;i<TL_WEEKS;i++){
    if(hasConfig){
      ws.push(getSprintForWeek(i));
    } else {
      // fall back to manual sprints in D.sprints
      var wd=wkDate(i).getTime(),sp=null;
      for(var si=0;si<D.sprints.length;si++){
        var sv=D.sprints[si];
        if(wd>=pd(sv.start).getTime()&&wd<=pd(sv.end).getTime()){sp=sv;break;}
      }
      ws.push(sp);
    }
  }
  var i=0;
  while(i<TL_WEEKS){
    if(!ws[i]){var e=document.createElement('div');e.className='spr-empty';e.style.width=WW_+'px';row.appendChild(e);i++;}
    else{
      var sp=ws[i],s0=i;
      while(i<TL_WEEKS&&ws[i]&&ws[i]._idx===sp._idx)i++;
      var cnt=i-s0;
      var wrap=document.createElement('div');wrap.className='spr-block';wrap.style.width=(cnt*WW_)+'px';
      var inn=document.createElement('div');inn.className='spr-inner';inn.style.width=(cnt*WW_-2)+'px';
      var nm=document.createElement('span');nm.textContent=sp.name;
      inn.appendChild(nm);
      wrap.appendChild(inn);
      row.appendChild(wrap);
    }
  }
}

function getWorkerIdsUnder(row){
  // returns all worker ids that are children of this group or team
  var wids=[];
  if(row.type==='group'){
    D.teams.filter(function(t){return t.gid===row.obj.id;}).forEach(function(t){
      D.workers.filter(function(w){return w.tid===t.id;}).forEach(function(w){wids.push(w.id);});
    });
  } else if(row.type==='team'){
    D.workers.filter(function(w){return w.tid===row.obj.id;}).forEach(function(w){wids.push(w.id);});
  }
  return wids;
}

function getRollupRange(wids){
  // get earliest start and latest end across all tasks for these workers
  var tasks=D.tasks.filter(function(t){return wids.indexOf(t.wid)!==-1;});
  if(!tasks.length)return null;
  var minStart=tasks.reduce(function(m,t){return t.start<m?t.start:m;},tasks[0].start);
  var maxEnd=tasks.reduce(function(m,t){return t.end>m?t.end:m;},tasks[0].end);
  return {start:minStart,end:maxEnd,tasks:tasks};
}

function getRollupColor(row){
  if(row.type==='team'){
    // use first worker's color
    var w=D.workers.find(function(w){return w.tid===row.obj.id;});
    return w?w.color:'#378ADD';
  }
  // group: blend - just use first team's first worker
  var t=D.teams.find(function(t){return t.gid===row.obj.id;});
  if(t){var w=D.workers.find(function(w){return w.tid===t.id;});if(w)return w.color;}
  return '#378ADD';
}

// ── DRAG & RESIZE ──────────────────────────────────────────────────────────
function resolvePush(wid){
  var tasks=D.tasks.filter(function(x){return x.wid===wid;});
  tasks.sort(function(a,b){return pd(a.start).getTime()-pd(b.start).getTime();});
  for(var i=0;i<tasks.length-1;i++){
    var a=tasks[i],b=tasks[i+1];
    // a ends on Saturday, b starts on Sunday — overlap if b.start <= a.end
    if(pd(b.start).getTime()<=pd(a.end).getTime()){
      b.start=fd(addW(pd(a.start),a.weeks||1));
      b.end=fd(addD(addW(pd(b.start),b.weeks-1),6));
    }
  }
  propagateDeps();
}

function propagateDeps(){
  // push dep targets forward if they start before their source ends
  var changed=true,iter=0;
  while(changed&&iter<10){
    changed=false;iter++;
    D.deps.forEach(function(dep){
      var from=D.tasks.find(function(x){return x.id===dep.fromTid;});
      var to=D.tasks.find(function(x){return x.id===dep.toTid;});
      if(!from||!to)return;
      if(pd(to.start).getTime()<=pd(from.end).getTime()){
        var span=Math.round(diffW(pd(to.start),pd(to.end)));
        if(span<1)span=1;
        to.start=fd(addW(pd(from.end),1));
        to.end=fd(addW(pd(to.start),span));
        changed=true;
      }
    });
  }
}

function getWorkerRowAtY(y){
  // find which worker tlrow contains y coordinate
  var rows=document.querySelectorAll('.tlrow[data-wid]');
  for(var i=0;i<rows.length;i++){
    var r=rows[i].getBoundingClientRect();
    if(y>=r.top&&y<=r.bottom)return +rows[i].dataset.wid;
  }
  return null;
}

function getWorkerRowAtY(clientY){
  var rows=document.querySelectorAll('.tlrow[data-wid]');
  for(var i=0;i<rows.length;i++){
    var r=rows[i].getBoundingClientRect();
    if(clientY>=r.top&&clientY<r.bottom)return {wid:+rows[i].dataset.wid,el:rows[i]};
  }
  return null;
}

function startDrag(e,tid,worker,blk){
  e.preventDefault();
  snapshot();
  var t=D.tasks.find(function(x){return x.id===tid;});
  blk.classList.add('drag');
  var os=t.start,sx=e.clientX,last=null;
  var currentRow=blk.parentElement;
  // save original positions — use weeks directly
  var origPos={};
  D.tasks.filter(function(x){return x.wid===worker.id;}).forEach(function(x){
    origPos[x.id]={start:x.start,end:x.end,weeks:x.weeks||1};
  });

  function onMove(ev){
    var d=Math.round(-(ev.clientX-sx)/WW());
    if(d!==last){
      last=d;
      var newStart=addW(pd(os),d);
      // snap to nearest Sunday
      var day=newStart.getDay(); // 0=Sun
      if(day!==0)newStart=addD(newStart,-day);
      t.start=fd(newStart);
      t.end=fd(addD(addW(newStart,t.weeks-1),6));
      blk.style.right=dateRight(t.start)+'px';
      // restore all other tasks to original, then push
      D.tasks.filter(function(x){return x.wid===t.wid&&x.id!==tid;}).forEach(function(x){
        if(origPos[x.id]){x.start=origPos[x.id].start;x.end=origPos[x.id].end;x.weeks=origPos[x.id].weeks;}
      });
      resolvePush(t.wid);
      // update visuals
      D.tasks.forEach(function(x){
        if(x.id===tid)return;
        var b=document.querySelector('.blk[data-tid="'+x.id+'"]');
        if(!b)return;
        b.style.right=dateRight(x.start)+'px';
        b.style.width=((x.weeks||1)*WW()-2)+'px';
      });
    }
    // vertical - cross row
    var rows=document.querySelectorAll('.tlrow[data-wid]');
    for(var i=0;i<rows.length;i++){
      var r=rows[i].getBoundingClientRect();
      if(ev.clientY>=r.top&&ev.clientY<r.bottom){
        var newWid=+rows[i].dataset.wid;
        if(rows[i]!==currentRow){
          rows[i].appendChild(blk);
          currentRow=rows[i];
          t.wid=newWid;

var _depCanvas=null,_depCtx=null,_depDraft=null;

function initDepCanvas(){
  _depCanvas=document.getElementById('depCanvas');
  _depCtx=_depCanvas.getContext('2d');
  _depCanvas.width=window.innerWidth;
  _depCanvas.height=window.innerHeight;
  window.addEventListener('resize',function(){
    _depCanvas.width=window.innerWidth;_depCanvas.height=window.innerHeight;redrawDeps();
  });

function initDepHover(){
  var btn=document.getElementById('depDelBtn');
  var _hov=null;
  function check(e){
    if(_depDraft)return;
    var found=null;
    for(var i=0;i<D.deps.length;i++){
      var dep=D.deps[i];
      var a1=blkAnchor(dep.fromTid,dep.fromSide);
      var a2=blkAnchor(dep.toTid,dep.toSide);
      if(!a1||!a2)continue;
      if(distToCurve(e.clientX,e.clientY,a1.x,a1.y,a2.x,a2.y)<10){
        found={dep:dep,a1:a1,a2:a2};break;
      }
    }
    if(found){
      _hov=found.dep;
      // exact bezier midpoint at t=0.5
      var a1=found.a1,a2=found.a2;
      var bcx=(a1.x+a2.x)/2;
      var mx=0.125*a1.x+0.375*bcx+0.375*bcx+0.125*a2.x;
      var my=0.125*a1.y+0.375*a1.y+0.375*a2.y+0.125*a2.y;
      btn.style.cssText='position:fixed;display:flex;left:'+(mx-7)+'px;top:'+(my-7)+'px;';
    } else if(!btn.matches(':hover')){
      _hov=null;btn.style.display='none';
    }
  }
  document.addEventListener('mousemove',check,{passive:true});
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    if(!_hov)return;
    var id=_hov.id;
    snapshot();
    D.deps=D.deps.filter(function(d){return d.id!==id;});
    _hov=null;btn.style.display='none';
    render();toast('תלות נמחקה');
  });
}

function distToCurve(px,py,x1,y1,x2,y2){
  // sample bezier at N points and return min distance to (px,py)
  var cx=(x1+x2)/2;
  var minD=Infinity;
  for(var i=0;i<=20;i++){
    var t=i/20;
    var u=1-t;
    // cubic bezier: P0*(1-t)^3 + 3*P1*(1-t)^2*t + 3*P2*(1-t)*t^2 + P3*t^3
    // control points: (x1,y1), (cx,y1), (cx,y2), (x2,y2)
    var bx=u*u*u*x1+3*u*u*t*cx+3*u*t*t*cx+t*t*t*x2;
    var by=u*u*u*y1+3*u*u*t*y1+3*u*t*t*y2+t*t*t*y2;
    var d=Math.sqrt((bx-px)*(bx-px)+(by-py)*(by-py));
    if(d<minD)minD=d;
  }
  return minD;
}

function blkAnchor(tid,side){
  var blk=document.querySelector('.blk[data-tid="'+String(tid)+'"]');
  if(!blk)return null;
  var r=blk.getBoundingClientRect();
  // only draw if block is in viewport
  if(r.right<0||r.left>window.innerWidth||r.bottom<0||r.top>window.innerHeight)return null;
  return {x:side==='start'?r.right:r.left, y:r.top+r.height/2};
}

function drawCurve(x1,y1,x2,y2,draft){
  var cx=(x1+x2)/2;
  _depCtx.beginPath();
  _depCtx.moveTo(x1,y1);
  _depCtx.bezierCurveTo(cx,y1,cx,y2,x2,y2);
  _depCtx.strokeStyle='#93C5FD';
  _depCtx.lineWidth=1.5;
  if(draft){_depCtx.setLineDash([4,3]);_depCtx.globalAlpha=0.7;}
  else{_depCtx.setLineDash([]);_depCtx.globalAlpha=1;}
  _depCtx.stroke();
  _depCtx.setLineDash([]);_depCtx.globalAlpha=1;
}

function redrawDeps(){
  if(!_depCtx)return;
  _depCtx.clearRect(0,0,_depCanvas.width,_depCanvas.height);
  D.deps.forEach(function(dep){
    var a1=blkAnchor(dep.fromTid,dep.fromSide);
    var a2=blkAnchor(dep.toTid,dep.toSide);
    if(a1&&a2)drawCurve(a1.x,a1.y,a2.x,a2.y,false);
  });
  if(_depDraft)drawCurve(_depDraft.x1,_depDraft.y1,_depDraft.mx,_depDraft.my,true);
}

function startDepDrag(e,dot){
  var fromTid=+dot.dataset.tid, fromSide=dot.dataset.side;
  var r=dot.getBoundingClientRect();
  var x1=r.left+r.width/2, y1=r.top+r.height/2;
  _depDraft={x1:x1,y1:y1,mx:x1,my:y1};

  function onMove(e){_depDraft.mx=e.clientX;_depDraft.my=e.clientY;redrawDeps();}
  function onUp(e){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    _depDraft=null;
    // find target dot by proximity (20px radius)
    var found=null;
    document.querySelectorAll('.dep-dot').forEach(function(d){
      if(+d.dataset.tid===fromTid)return;
      var dr=d.getBoundingClientRect();
      var cx=dr.left+dr.width/2,cy=dr.top+dr.height/2;
      if(Math.sqrt((cx-e.clientX)*(cx-e.clientX)+(cy-e.clientY)*(cy-e.clientY))<20)found=d;
    });
    // fallback: snap to block
    if(!found){
      var el=document.elementFromPoint(e.clientX,e.clientY);
      while(el&&el!==document.body){
        if(el.classList&&el.classList.contains('blk')&&+el.dataset.tid!==fromTid){
          var br=el.getBoundingClientRect();
          var toSide=e.clientX>=(br.left+br.width/2)?'start':'end';
          found={dataset:{tid:el.dataset.tid,side:toSide}};break;
        }
        el=el.parentElement;
      }
    }
    if(found){
      var toTid=+found.dataset.tid, toSide=found.dataset.side;
      if(!D.deps.find(function(d){return d.fromTid===fromTid&&d.toTid===toTid;})){
        snapshot();
        D.deps.push({id:D.nextDid++,fromTid:fromTid,fromSide:fromSide,toTid:toTid,toSide:toSide});
        render();toast('תלות נוספה ✓');
      }
    }
    redrawDeps();
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function openCP(e,target){
  _cpTarget=target;var pop=document.getElementById('cpop');pop.innerHTML='';
  // determine palette
  var palette=COLS;
  if(target.type==='worker'){
    var w=D.workers.find(function(x){return x.id===target.wid;});
    if(w){
      var grp=null;
      if(w.gid)grp=D.groups.find(function(g){return +g.id===+w.gid;});
      else if(w.tid){var tm=D.teams.find(function(t){return +t.id===+w.tid;});if(tm)grp=D.groups.find(function(g){return +g.id===+tm.gid;});}
      var baseCol=grp&&grp.color?grp.color:w.color;
      if(baseCol)palette=groupShades(baseCol);
    }
  }
  palette.forEach(function(col){
    var sw=document.createElement('div');sw.className='copt';sw.style.background=col;
    sw.addEventListener('click',function(ev){
      ev.stopPropagation();
      if(_cpTarget.type==='worker'){var w=D.workers.find(function(x){return x.id===_cpTarget.wid;});if(w)w.color=col;}
      else if(_cpTarget.type==='task'){var t=D.tasks.find(function(x){return x.id===_cpTarget.tid;});if(t)t.color=col;}
      else if(_cpTarget.type==='multi'){snapshot();D.tasks.forEach(function(t){if(selectedTids.has(+t.id))t.color=col;});clearSel();}
      pop.style.display='none';render();
    });
    pop.appendChild(sw);
  });
  pop.style.cssText='display:flex;top:'+e.clientY+'px;';
  // position to the left of click, ensure it stays in viewport
  pop.style.left=''; pop.style.right='';
  document.body.appendChild(pop); // ensure it's in DOM for width calc
  var pw=pop.offsetWidth||130;
  var left=e.clientX-pw-8;
  if(left<4)left=4;
  pop.style.left=left+'px';
  e.stopPropagation();
}

function om(id){document.getElementById(id).classList.add('open');}

function buildColors(cid,sel,nullable,baseColor){
  var c=document.getElementById(cid);c.innerHTML='';

function buildSummary(){
  var body=document.getElementById('summaryBody');
  if(!body)return;
  var cfg=JSON.parse(localStorage.getItem('te_sprint_config')||'{}');
  var HPW=cfg.hoursPerWeek||42;
  function taskWeeks(t){return Math.max(1,Math.round((pd(t.end).getTime()-pd(t.start).getTime()-6*86400000)/(7*86400000))+1);}
  var rows=[];var totalWeeks=0,totalHours=0;
  D.groups.forEach(function(g){
    var gWeeks=0;
    var teamRows=[];
    D.teams.filter(function(t){return +t.gid===+g.id;}).forEach(function(team){
      var wids=D.workers.filter(function(w){return +w.tid===+team.id;}).map(function(w){return w.id;});
      var tWeeks=0;
      wids.forEach(function(wid){D.tasks.filter(function(t){return +t.wid===+wid&&!t.offProject;}).forEach(function(t){tWeeks+=taskWeeks(t);});});
      if(tWeeks>0){teamRows.push({name:team.name,weeks:tWeeks,hours:tWeeks*HPW});gWeeks+=tWeeks;}
    });
    var directWids=D.workers.filter(function(w){return +w.gid===+g.id&&(!w.tid||!D.teams.find(function(t){return +t.id===+w.tid;}));}).map(function(w){return w.id;});
    var directWeeks=0;
    directWids.forEach(function(wid){D.tasks.filter(function(t){return +t.wid===+wid&&!t.offProject;}).forEach(function(t){directWeeks+=taskWeeks(t);});});
    if(directWeeks>0){teamRows.push({name:'ישיר לקבוצה',weeks:directWeeks,hours:directWeeks*HPW});gWeeks+=directWeeks;}
    if(gWeeks>0){rows.push({name:g.name,weeks:gWeeks,hours:gWeeks*HPW,teams:teamRows});totalWeeks+=gWeeks;totalHours+=gWeeks*HPW;}
  });
  var html='';
  rows.forEach(function(g){
    html+='<div style="margin-bottom:14px;">';
    html+='<div style="display:flex;justify-content:space-between;padding:7px 10px;background:var(--bg);border-radius:var(--r);font-weight:700;font-size:13px;">';
    html+='<span>'+g.name+'</span><span style="color:var(--acc);">'+g.weeks+' שבועות  '+g.hours+' שעות</span></div>';
    g.teams.forEach(function(t){
      html+='<div style="display:flex;justify-content:space-between;padding:5px 10px 5px 20px;font-size:12px;border-bottom:1px solid var(--brd);">';
      html+='<span style="color:var(--mut);">'+t.name+'</span><span>'+t.weeks+' שבועות  '+t.hours+' שעות</span></div>';
    });
    html+='</div>';
  });
  html+='<div style="display:flex;justify-content:space-between;padding:10px;background:#1E3A5F;border-radius:var(--r);color:#fff;font-weight:700;font-size:13px;margin-top:8px;">';
  html+='<span>סה"כ</span><span>'+totalWeeks+' שבועות  '+totalHours+' שעות</span></div>';
  // off-project tasks
  var offTasks=D.tasks.filter(function(t){return t.offProject;});
  if(offTasks.length){
    var offWeeks=0;
    offTasks.forEach(function(t){offWeeks+=taskWeeks(t);});
    var offHours=offWeeks*HPW;
    html+='<div style="margin-top:14px;border-top:2px dashed var(--brd);padding-top:10px;">';
    html+='<div style="font-size:11px;font-weight:700;color:var(--mut);margin-bottom:6px;">לא על חשבון הפרויקט</div>';
    offTasks.forEach(function(t){
      var w=D.workers.find(function(x){return x.id===t.wid;});
      var tw=taskWeeks(t);
      html+='<div style="display:flex;justify-content:space-between;padding:5px 10px;font-size:12px;border-bottom:1px solid var(--brd);">';
      html+='<span style="color:var(--mut);">'+(w?w.name:'')+' — '+t.name+'</span><span>'+tw+' שבועות  '+(tw*HPW)+' שעות</span></div>';
    });
    html+='<div style="display:flex;justify-content:space-between;padding:7px 10px;background:var(--bg);border-radius:var(--r);font-weight:700;font-size:12px;margin-top:4px;">';
    html+='<span>סה"כ לא על חשבון</span><span style="color:var(--mut);">'+offWeeks+' שבועות  '+offHours+' שעות</span></div>';
    html+='</div>';
  }
  body.innerHTML=html;
}

window.exportSummaryXlsx=function exportSummaryXlsx(){
  if(typeof XLSX==='undefined'){toast('טוען...');return;}
  var cfg=JSON.parse(localStorage.getItem('te_sprint_config')||'{}');
  var HPW=cfg.hoursPerWeek||42;
  function taskWeeks(t){return Math.max(1,Math.round((pd(t.end).getTime()-pd(t.start).getTime()-6*86400000)/(7*86400000))+1);}
  var wsData=[['קבוצה','צוות','שבועות','שעות']];
  var totalW=0,totalH=0;
  D.groups.forEach(function(g){
    var gW=0;
    D.teams.filter(function(t){return +t.gid===+g.id;}).forEach(function(team){
      var wids=D.workers.filter(function(w){return +w.tid===+team.id;}).map(function(w){return w.id;});
      var tW=0;
      wids.forEach(function(wid){D.tasks.filter(function(t){return +t.wid===+wid&&!t.offProject;}).forEach(function(t){tW+=taskWeeks(t);});});
      if(tW>0){wsData.push([g.name,team.name,tW,tW*HPW]);gW+=tW;}
    });
    var dW=0;
    D.workers.filter(function(w){return +w.gid===+g.id&&(!w.tid||!D.teams.find(function(t){return +t.id===+w.tid;}));}).forEach(function(w){
      D.tasks.filter(function(t){return +t.wid===+w.id&&!t.offProject;}).forEach(function(t){dW+=taskWeeks(t);});
    });
    if(dW>0){wsData.push([g.name,'ישיר לקבוצה',dW,dW*HPW]);gW+=dW;}
    if(gW>0){wsData.push([g.name,'סה"כ',gW,gW*HPW]);totalW+=gW;totalH+=gW*HPW;}
  });
  wsData.push(['','','','']);
  wsData.push(['סה"כ','',totalW,totalH]);
  // off-project section
  var offTasks=D.tasks.filter(function(t){return t.offProject;});
  if(offTasks.length){
    wsData.push(['','','','']);
    wsData.push(['לא על חשבון הפרויקט','','','']);
    var offTotalW=0;
    offTasks.forEach(function(t){
      var w=D.workers.find(function(x){return x.id===t.wid;});
      var tw=taskWeeks(t);
      wsData.push([(w?w.name:'')+' — '+t.name,'',tw,tw*HPW]);
      offTotalW+=tw;
    });
    wsData.push(['סה"כ לא על חשבון','',offTotalW,offTotalW*HPW]);
  }
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols']=[{wch:20},{wch:20},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,'סיכום');
  XLSX.writeFile(wb,'summary.xlsx');
  toast('Excel יוצא');
};

function buildTasksTable(){
  var body=document.getElementById('tasksTableBody');
  if(!body)return;
  var rows=[];
  D.groups.forEach(function(g){
    var workers=[];
    // workers via teams
    D.teams.filter(function(t){return +t.gid===+g.id;}).forEach(function(team){
      D.workers.filter(function(w){return +w.tid===+team.id;}).forEach(function(w){workers.push(w);});
    });
    // direct workers
    D.workers.filter(function(w){return +w.gid===+g.id&&(!w.tid||!D.teams.find(function(t){return +t.id===+w.tid;}));}).forEach(function(w){workers.push(w);});
    workers.forEach(function(w){
      var tasks=D.tasks.filter(function(t){return +t.wid===+w.id;});
      if(!tasks.length)return;
      tasks.forEach(function(t,ti){
        rows.push({gname:g.name,gspan:0,wname:w.name,wcolor:w.color,wspan:0,tname:t.name,weeks:t.weeks||1,first:ti===0,gFirst:false,offProject:t.offProject});
      });
    });
  });
  // calc spans
  var i=0;
  while(i<rows.length){
    // group span
    var gname=rows[i].gname,gs=i;
    while(i<rows.length&&rows[i].gname===gname)i++;
    rows[gs].gspan=i-gs;rows[gs].gFirst=true;
  }
  i=0;
  while(i<rows.length){
    var wname=rows[i].wname,gn=rows[i].gname,ws2=i;
    while(i<rows.length&&rows[i].wname===wname&&rows[i].gname===gn)i++;
    rows[ws2].wspan=i-ws2;
  }

  var html='<table style="width:100%;border-collapse:collapse;font-size:12px;font-family:Heebo,sans-serif;direction:rtl;">';
  html+='<thead><tr style="background:#1E3A5F;color:#fff;">';
  html+='<th style="padding:8px 10px;text-align:right;font-weight:700;">קבוצה</th>';
  html+='<th style="padding:8px 10px;text-align:right;font-weight:700;">עובד</th>';
  html+='<th style="padding:8px 10px;text-align:right;font-weight:700;">משימה</th>';
  html+='<th style="padding:8px 10px;text-align:center;font-weight:700;white-space:nowrap;">שבועות</th>';
  html+='</tr></thead><tbody>';

  rows.forEach(function(r){
    html+='<tr style="border-bottom:1px solid #E0DED8;'+(r.offProject?'opacity:.6;':'')+'">';
    if(r.gFirst){
      html+='<td rowspan="'+r.gspan+'" style="padding:8px 10px;vertical-align:middle;font-weight:700;background:#F0EEE8;border-left:3px solid #1E3A5F;text-align:right;">'+r.gname+'</td>';
    }
    if(r.first){
      html+='<td rowspan="'+r.wspan+'" style="padding:8px 10px;vertical-align:middle;text-align:right;background:#FAFAF8;">';
      html+='<span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:8px;height:8px;border-radius:50%;background:'+r.wcolor+';flex-shrink:0;display:inline-block;"></span><span>'+r.wname+'</span></span></td>';
    }
    html+='<td style="padding:6px 10px;text-align:right;">'+(r.offProject?'<span style="color:#888;font-size:10px;">🔀</span> ':'')+r.tname+'</td>';
    html+='<td style="padding:6px 10px;text-align:center;font-weight:600;color:#378ADD;">'+r.weeks+'</td>';
    html+='</tr>';
  });
  html+='</tbody></table>';
  body.innerHTML=html;
}

window.exportTasksTableXlsx=function(){
  if(typeof XLSX==='undefined'){toast('טוען...');return;}
  var wsData=[['קבוצה','עובד','משימה','שבועות','לא על חשבון']];
  D.groups.forEach(function(g){
    var workers=[];
    D.teams.filter(function(t){return +t.gid===+g.id;}).forEach(function(team){
      D.workers.filter(function(w){return +w.tid===+team.id;}).forEach(function(w){workers.push(w);});
    });
    D.workers.filter(function(w){return +w.gid===+g.id&&(!w.tid||!D.teams.find(function(t){return +t.id===+w.tid;}));}).forEach(function(w){workers.push(w);});
    workers.forEach(function(w){
      var tasks=D.tasks.filter(function(t){return +t.wid===+w.id;});
      tasks.forEach(function(t){
        wsData.push([g.name,w.name,t.name,t.weeks||1,t.offProject?'כן':'']);
      });
    });
  });
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols']=[{wch:16},{wch:16},{wch:30},{wch:10},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws,'משימות');
  XLSX.writeFile(wb,'tasks.xlsx');
  toast('Excel יוצא');
};

document.getElementById('exportBtn').onclick=function(){
  var rows=[['משימה','עובד','התחלה','סיום','תלות']];
  D.tasks.forEach(function(t){
    var w=D.workers.find(function(x){return x.id===t.wid;});
    var depNames=D.deps.filter(function(d){return d.toTid===t.id;}).map(function(d){
      var ft=D.tasks.find(function(x){return x.id===d.fromTid;});return ft?ft.name:'';
    }).filter(Boolean).join(' | ');
    rows.push([t.name,w?w.name:'',t.start,t.end,depNames]);
    if(t.spanWid){var w2=D.workers.find(function(x){return x.id===t.spanWid;});if(w2)rows.push([t.name,w2.name,t.start,t.end,depNames]);}
  });
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='תכנית_עבודה.csv';a.click();
  toast('✅ ייצוא הושלם');
};

// ── Firebase sync ──────────────────────────────────────────────────────────
(function(){
  var pid=sessionStorage.getItem('te_active_pid');
  if(!pid) return;
  // המתן ל-Firebase functions
  var tries=0;
  var interval=setInterval(async function(){
    tries++;
    if(tries>30){clearInterval(interval);return;}
    if(!window._fbLoadPlanner||!window._fbStartPlannerSync) return;
    clearInterval(interval);
    // טעינה ראשונית מ-Firebase אם localStorage ריק/ישן
    var fbData=await window._fbLoadPlanner(pid);
    if(fbData&&fbData.data){
      var localRaw=localStorage.getItem('te_proj_'+pid);
      var localProj=localRaw?JSON.parse(localRaw):null;
      // השתמש ב-Firebase אם עדכני יותר
      if(!localProj||!localProj.meta||fbData.meta.updatedAt>localProj.meta.updatedAt){
        localStorage.setItem('te_proj_'+pid,JSON.stringify(fbData));
        // עדכן D ישירות
        D=fbData.data;
        var sd={D:D,ZL:ZL,TL_WEEKS:TL_WEEKS,TL_START:fd(TL_START),collapsed:collapsed,MODE_WEEKS:MODE_WEEKS};
        sessionStorage.setItem(SK,JSON.stringify(sd));
        render();
        toast('🔄 נטען מהענן');
      }
    }
    // הפעל real-time sync
    window._fbStartPlannerSync(pid);
    // __ tePlannerLoad — נקרא מ-onSnapshot כשמשתמש אחר שינה
    window._tePlannerLoad=function(remote){
      if(!remote||!remote.data) return;
      D=remote.data;
      var sd={D:D,ZL:ZL,TL_WEEKS:TL_WEEKS,TL_START:fd(TL_START),collapsed:collapsed,MODE_WEEKS:MODE_WEEKS};
      sessionStorage.setItem(SK,JSON.stringify(sd));
      render();
      toast('🔄 עודכן על ידי משתמש אחר');
    };
    window._teD=D;
  },100);
})();

function updateTaskEnd(){
  var s=document.getElementById('tsm-start').value;
  var w=parseInt(document.getElementById('tsm-weeks').value)||1;
  if(s){document.getElementById('tsm-end').value=fd(addD(addW(pd(s),w-1),6));}
}
function updateTaskWeeks(){
  var s=document.getElementById('tsm-start').value;
  var e=document.getElementById('tsm-end').value;
  if(s&&e){
    var w=Math.max(1,Math.round((pd(e).getTime()-pd(s).getTime()-6*86400000)/(7*86400000))+1);
    document.getElementById('tsm-weeks').value=w;
  }
}

// ── COPY / PASTE ──────────────────────────────────────────────────────────
window.addEventListener('keydown',function(e){
  if(!(e.ctrlKey||e.metaKey))return;
  if(e.keyCode===67){
    if(_lastClickedTid){
      var t=D.tasks.find(function(x){return +x.id===+_lastClickedTid;});
      if(t){_clipboard=JSON.parse(JSON.stringify(t));toast('✂️ הועתק');e.preventDefault();}
    }
  }
  if(e.keyCode===86){
    if(!_clipboard){toast('אין משימה מועתקת');return;}
    if(!_lastPasteWid){toast('העבר עכבר לשורת עובד');return;}
    e.preventDefault();
    var w=D.workers.find(function(x){return x.id===_lastPasteWid;});
    if(!w)return;
    snapshot();
    var nt=JSON.parse(JSON.stringify(_clipboard));
    nt.id=D.nextTid++;nt.wid=w.id;nt.color=null;
    // place at mouse position, keep original span
    var span=Math.round(diffW(pd(nt.start),pd(nt.end)));
    if(span<1)span=1;
    if(_lastMouseWi!==null){
      nt.start=fd(wkDate(_lastMouseWi));
      nt.end=fd(addW(pd(nt.start),span));
    }
    D.tasks.push(nt);
    render();toast('📋 הודבק ל-'+w.name);
  }
},true); // capture=true
